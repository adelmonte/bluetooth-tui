[package]
name = "bluetooth-tui"
version = "0.2.0"
edition = "2024"
description = "A modern terminal UI for Bluetooth (BlueZ)"
license = "GPL-3.0-or-later"
authors = ["adelmonte"]

[profile.release]
lto = "thin"
strip = true

[dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd"] }
clap = { version = "4.6.10", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
toml = "1.2.3"
toml_edit = "0.25.21"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.3"
